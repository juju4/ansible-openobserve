---
- name: Ensure logrotate package is present
  ansible.builtin.package:
    name: logrotate
    state: present
  register: pkg_result
  until: pkg_result is success

- name: Add logrotate configuration for openobserve logs
  ansible.builtin.template:
    src: logrotate-openobserve.j2
    dest: /etc/logrotate.d/openobserve
    mode: "0644"
    backup: true

- name: Global logrotate configuration validation
  ansible.builtin.command:
    cmd: logrotate -dv /etc/logrotate.conf
  changed_when: false
